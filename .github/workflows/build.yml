name: Build JS bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Commit built artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: rebuild js/editor-bundle.js [skip ci]'
          # Commit everything webpack produced in js/ plus the lock file
          file_pattern: 'js/ package-lock.json'
          commit_user_name:  'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
