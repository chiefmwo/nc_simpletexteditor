name: Build JS bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
  workflow_dispatch:

# Use Node.js 24 for the action runners (suppresses the Node 20 warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # cache: 'npm' requires package-lock.json; omitted until the first
          # build commits it back.  Re-add once package-lock.json exists.

      - name: Install dependencies
        # npm install (not npm ci) so the run succeeds without a lock file.
        # The generated package-lock.json is committed back below.
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Commit built artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: rebuild js/editor-bundle.js [skip ci]'
          # Also commit package-lock.json so future runs can use npm ci + cache
          file_pattern: 'js/editor-bundle.js package-lock.json'
          commit_user_name:  'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
